# These environment variables must be set in CircleCI UI
#
# DOCKERHUB_REPO - docker hub repo, format: <username>/<repo>
# DOCKER_EMAIL   - login info for docker hub
# DOCKER_USER
# DOCKER_PASS
#

version: 2
jobs:
  checkout_code:
    docker:
      - image: ubuntu:16.04
    working_directory: ~/buildhub
    steps:
      - run:
          name: Install essential packages
          command: |
            apt-get update && apt-get install -y ca-certificates git
      - checkout
      - save_cache:
          key: v1-repo-{{ .Environment.CIRCLE_SHA1 }}
          paths:
            - ~/buildhub

  build_test_and_deploy:
    docker:
      - image: ubuntu:16.04
    working_directory: ~/buildhub
    steps:
      - run:
          name: Install essential packages
          command: |
            apt-get update && apt-get install -y ca-certificates curl python3-pip

      - restore_cache:
          keys:
            - v1-repo-{{ .Environment.CIRCLE_SHA1 }}

      - run:
          name: Install Docker
          command: |
            set -x
            VER="17.09.0-ce"
            curl -L -o /tmp/docker-$VER.tgz https://download.docker.com/linux/static/stable/x86_64/docker-$VER.tgz
            tar -xz -C /tmp -f /tmp/docker-$VER.tgz
            mv /tmp/docker/* /usr/bin

      - run:
          name: Install Docker Compose
          command: |
            set -x
            curl -L https://github.com/docker/compose/releases/download/1.16.0/docker-compose-`uname -s`-`uname -m` > /usr/local/bin/docker-compose
            chmod +x /usr/local/bin/docker-compose

      - setup_remote_docker:
          version: 17.09.0-ce

      - run:
          name: Create version.json
          command: |
            # create a version.json per https://github.com/mozilla-services/Dockerflow/blob/master/docs/version_object.md
            printf '{"commit":"%s","version":"%s","source":"https://github.com/%s/%s","build":"%s"}\n' \
            "$CIRCLE_SHA1" \
            "$CIRCLE_TAG" \
            "$CIRCLE_PROJECT_USERNAME" \
            "$CIRCLE_PROJECT_REPONAME" \
            "$CIRCLE_BUILD_URL" > version.json

      # - run:
      #     name: Start kinto
      #     background: true
      #     command: |
      #       pip3 install kinto kinto
      #       kinto init --backend memory
      #       kinto start

      # - run:
      #     name: Start kinto-wizard
      #     command: |
      #       pip3 install kinto-wizard
      #       #kinto init --backend memory
      #       #kinto start
      #       #kinto-wizard load jobs/buildhub/initialization.yml --server http://localhost:8888/v1 --auth user:pass
      #       # curl --retry-connrefused doesn't work in ubuntu 16.04.
      #       sleep 15 && kinto-wizard load jobs/buildhub/initialization.yml --server http://localhost:8888/v1 --auth user:pass

      # - run:
      #     name: Build Docker image
      #     command: |
      #       # docker build -t mozilla/buildhub .
      #       docker-compose build kinto-ci

      - run:
          name: Start kinto
          # background: true
          command: |
            # XXX We could use something like:
            # `docker-compose run --service-ports kinto ci-specific-start-cmd`
            # docker-compose build kinto-ci
            docker-compose up -d kinto

      - run:
          name: Initialize the kinto-wizard
          command: |
            echo "DOES THIS NEED TO WAIT?"
            sleep 5
            # This shouldn't need to first build, because `docker-compose run ...`
            # will do that automatically if it needs to.
            # docker-compose build kinto
            # curl kinto:8888
            docker-compose run kinto initialize-kinto-wizard jobs/buildhub/initialization.yml  --server http://kinto:8888/v1 --auth user:pass

      - run:
          name: Run functional tests
          command: |
            # docker-compose run kinto initialize-kinto-wizard jobs/buildhub/initialization.yml  --server http://kinto:8888/v1 --auth user:pass
            docker-compose run test functional-tests

      - run:
          name: Lint check
          command: |
            docker-compose run test lintcheck

      # XXX This is likely to be wrong. Check with old circle.yml file
      - run:
          name: Push to Dockerhub
          command: |
            # set DOCKER_DEPLOY=true in Circle UI to push to Dockerhub
            DOCKER_DEPLOY="${DOCKER_DEPLOY:-false}"
            if [ "${CIRCLE_BRANCH}" == "master" ]; then
              bin/ci/deploy-dockerhub.sh latest
            fi
            if [ -n "${CIRCLE_TAG}" ]; then
              bin/ci/deploy-dockerhub.sh "$CIRCLE_TAG"
            fi

  frontend:
    docker:
      - image: node:9
    working_directory: ~/buildhub
    steps:
      - checkout

      - run:
          name: "Checking Versions"
          command: |
            node --version
            npm --version

      - run:
          name: Install frontend dependencies
          command: |
            cd ui
            # Note, we can't use --production because the `npm run build`
            # command depends on react-scripts.
            npm install

      - run:
          name: Build frontend
          command: |
            pwd
            cd ui
            npm run build

workflows:
  version: 2

  # workflow jobs are _not_ run in tag builds by default
  # we use filters to whitelist jobs that should be run for tags

  # workflow jobs are run in _all_ branch builds by default
  # we use filters to blacklist jobs that shouldn't be run for a branch

  # see: https://circleci.com/docs/2.0/workflows/#git-tag-job-execution

  build-test-deploy:
    jobs:
      - checkout_code:
          filters:
            tags:
              only: /.*/
      - build_test_and_deploy:
          requires:
            - checkout_code
          filters:
            tags:
              only: /.*/
      - frontend

version: '2'

services:
  db:
    # As of Mar 8 2017, we run 9.6.6 in Buildhub production.
    image: postgres:9.6

  elasticsearch:
    # As of Mar 8 2017, we run es 5.4.0 in Buildhub production.
    image: docker.elastic.co/elasticsearch/elasticsearch:5.4.0
    environment:
      - cluster.name=docker-cluster
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 1g
    ports:
      - 9200:9200

  kinto:
    build:
      # So it can read files from within 'jobs/'
      context: .
      dockerfile: kinto/Dockerfile
    depends_on:
      - "db"
      - "elasticsearch"
    ports:
      - "8888:8888"
    volumes:
      - $PWD:/app

  testkinto:
    build:
      # So it can read files from within 'jobs/'
      context: .
      dockerfile: testkinto/Dockerfile
    ports:
      - "9999:9999"
    # XXX Not sure we need this. What business do you have in there?!
    volumes:
      - $PWD:/app

  buildhub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - CI
    image: mozilla/buildhub
    depends_on:
      - "kinto"
    environment:
      - SERVER_URL=http://kinto:8888/v1
    volumes:
      - $PWD:/app
    command: "true"
    # command: functional-tests




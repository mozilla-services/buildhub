version: '2'

services:
  # db:
  #   image: postgres:9.6

  # ------------------------------------------------------------------
  # After this point is dev-related services.
  # ------------------------------------------------------------------

  # Base container is used for development tasks like tests, linting, coverage
  # and building docs.
  base:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - CI
    image: mozilla/buildhub

  # Container specifically for running tests in CI
  # where you don't have a volume mount.
  # You can't use volume mounts in Circle so we need a compose directive
  # without mounts.
  test:
    extends:
      service: base
    depends_on:
      - "kinto"
    environment:
      - SERVER_URL=http://kinto:8888/v1
    command: functional-tests

  # Container specifically for running tests.
  # test-local:
  #   extends:
  #     service: test
  #   # environment:
  #   #   - SERVER_URL=http://kinto:8888/v1
  #   volumes:
  #     - $PWD:/app

  kinto:
    build:
      # So it can read files from within 'jobs/'
      context: .
      dockerfile: kinto/Dockerfile
    ports:
      - "8888:8888"
    # command: start-kinto

  # Container for local development with volume mount.
  # kinto-local:
  #   extends:
  #     service: kinto
  #   volumes:
  #     - $PWD:/app

  # Deliberately commented out because we are not going to run the
  # frontend ui code in Docker yet. Too many changes at once.
